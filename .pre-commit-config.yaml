# pre-commit hooks (#38). Install: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
#
# NOTE: ruff-format runs in CHECK-ONLY mode (--check) and excludes the
# legacy file scripts/check-links.py, which predates formatting and is
# not reformatted (no churn in behaviour PRs). New code must be clean.
# The whitespace/EOF hooks are scoped to first-party files: web/vendor,
# web/core and web/app are VENDORED and byte-frozen (docs/VENDORED.sums
# integrity check), and other legacy files are not churned here.
# Runtime stays stdlib-only: these hooks are dev/CI tools.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--no-fix]
      - id: ruff-format
        args: [--check]
        exclude: ^scripts/check-links\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(remote_desktop/|tests/|scripts/|systemd/|docs/|.github/).*\.(py|sh|md|yml|yaml|service|toml)$
      - id: end-of-file-fixer
        files: ^(remote_desktop/|tests/|scripts/).*\.py$
  - repo: local
    hooks:
      - id: shell-syntax
        name: shell syntax (sh -n)
        language: system
        entry: sh -n
        files: \.sh$

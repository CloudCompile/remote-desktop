name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$version" in
            *[!0-9.]*|.*|*.|*..*) echo "invalid version tag: $TAG" >&2; exit 1 ;;
          esac
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi
          python3 - "$version" <<'PY'
          import re
          import pathlib
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              raise SystemExit(f"empty changelog section for {version}")
          notes = match.group(1).strip() + "\n\n---\n\n"
          notes += "Roadmap: https://github.com/CloudCompile/remote-desktop/blob/main/ROADMAP.md\n"
          pathlib.Path("release-notes.md").write_text(notes)
          PY

      - name: Syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile control.py
          sh -n session.sh start.sh webapps.sh tunnel-url.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft=false \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

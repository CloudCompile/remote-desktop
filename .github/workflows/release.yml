name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$version" in
            *[!0-9.]*|.*|*.|*..*) echo "invalid version tag: $TAG" >&2; exit 1 ;;
          esac
          if ! grep -qE "^## \[${version}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}] — YYYY-MM-DD' section" >&2
            exit 1
          fi
          python3 - "$version" <<'PY'
          import re
          import pathlib
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\] — [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              raise SystemExit(f"empty changelog section for {version}")
          # the tagged version must be the newest section, so a stale tag
          # cannot publish notes that do not match the tree (#12)
          newest = re.search(r"^## \[([0-9.]+)\]", text, re.MULTILINE)
          if not newest or newest.group(1) != version:
              raise SystemExit(f"tag {version} is not the newest changelog section "
                               f"(newest is {newest.group(1) if newest else 'none'})")
          notes = match.group(1).strip() + "\n\n---\n\n"
          notes += "Roadmap: https://github.com/CloudCompile/remote-desktop/blob/main/ROADMAP.md\n"
          pathlib.Path("release-notes.md").write_text(notes)
          PY

      - name: Syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile control.py
          sh -n session.sh start.sh webapps.sh tunnel-url.sh

      - name: Generate SBOM (#128)
        run: |
          set -euo pipefail
          python3 scripts/sbom.py --version "${TAG:-dev}" --out sbom.json
          sha256sum sbom.json > sbom.json.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft=false \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
          # SBOM attached after the release exists (#128)
          gh release upload "$TAG" sbom.json sbom.json.sha256 --clobber

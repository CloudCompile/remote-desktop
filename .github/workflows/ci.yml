name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python syntax
        run: python3 -m py_compile control.py remote_desktop/*.py

      - name: Shell syntax
        run: sh -n session.sh start.sh webapps.sh tunnel-url.sh

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check control.py remote_desktop/ tests/ scripts/

      - name: JS syntax
        run: |
          set -e
          for f in web/touch.js web/app/*.js web/login.js; do node --check "$f"; done
          # CSP forbids inline scripts (#117): none may come back
          python3 - <<'PY'
          import re, pathlib
          bad = []
          for p in ("web/index.html", "web/login.html"):
              html = pathlib.Path(p).read_text()
              for m in re.finditer(r"<script(?![^>]*\bsrc=)[^>]*>", html):
                  bad.append((p, m.group(0)))
          if bad:
              print("inline <script> found (CSP #117 forbids it):", bad)
              raise SystemExit(1)
          PY

      - name: Docs links
        run: python3 scripts/check-links.py

      - name: Vendored integrity (#20)
        run: sha256sum -c docs/VENDORED.sums

      - name: No secrets committed
        run: |
          set -e
          for f in .passhash .pins.json .cliphistory.json; do
            if [ -e "$f" ]; then echo "refusing: $f must not be committed"; exit 1; fi
          done
          ! git ls-files | grep -E '(^|/)(__pycache__|.*\.pyc)$'

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13+ drops the crypt module: logins are disabled there (the
        # server runs, the auth tests skip). Supported baseline: 3.10-3.12.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps
        run: pip install pytest pytest-cov

      - name: Unit + integration tests with coverage gate (#35)
        env:
          # measured into the server subprocess by tests/coverage_entry.py
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: |
          python3 -m pytest --cov=remote_desktop --cov-branch \
            --cov-report=term-missing --cov-fail-under=40

      - name: Coverage summary
        run: python3 -m coverage report --format=total 2>/dev/null || true

  hooks:
    # 38: pre-commit in check-only mode (ruff check + ruff format --check
    # + whitespace). format is check-only: no reformats inside CI runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

